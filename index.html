<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pienti</title>
<meta name="description" content="Pienti — bağlantılar ve dijital katalog">
<meta name="theme-color" content="#0d0d10">
<meta property="og:title" content="Pienti">
<meta property="og:description" content="Bağlantılar ve dijital katalog">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>P</text></svg>">
<style>
  :root{
    --bg:#0d0d10;
    --bg-2:#15151b;
    --card:rgba(255,255,255,.055);
    --card-hover:rgba(255,255,255,.10);
    --border:rgba(255,255,255,.12);
    --text:#f4f4f6;
    --muted:#9a9aa6;
    --accent:#c9a227;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100svh;
    background:
      radial-gradient(1000px 600px at 50% -10%, #23232e 0%, transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:48px 16px calc(32px + env(safe-area-inset-bottom));
    text-align:center;
  }
  .wrap{width:100%;max-width:440px;animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .logo{
    width:88px;height:88px;margin:0 auto 20px;border-radius:26px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,#2a2a34,#17171d);
    border:1px solid var(--border);
    box-shadow:0 12px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    font-size:38px;font-weight:700;letter-spacing:-1px;color:var(--accent);
  }
  h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.6px}
  .sub{margin:8px 0 30px;color:var(--muted);font-size:15px;line-height:1.5}

  .links{display:flex;flex-direction:column;gap:14px}
  a.card{
    display:flex;align-items:center;gap:14px;
    padding:18px 18px;border-radius:18px;
    background:var(--card);border:1px solid var(--border);
    color:var(--text);text-decoration:none;text-align:left;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:transform .18s ease, background .18s ease, border-color .18s ease;
  }
  a.card:hover{background:var(--card-hover);border-color:rgba(255,255,255,.22);transform:translateY(-2px)}
  a.card:active{transform:scale(.985)}
  .ico{
    flex:0 0 46px;height:46px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(201,162,39,.14);border:1px solid rgba(201,162,39,.28);
  }
  .ico svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:16.5px;font-weight:600}
  .txt span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
  .arrow{flex:0 0 auto;opacity:.45}
  .arrow svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  footer{margin-top:34px;color:#6a6a76;font-size:12px;letter-spacing:.3px}

  @media (prefers-color-scheme: light){
    :root{
      --bg:#f6f6f8;--bg-2:#ececf1;
      --card:rgba(255,255,255,.85);--card-hover:#fff;
      --border:rgba(0,0,0,.09);--text:#16161a;--muted:#6b6b76;--accent:#a8861a;
    }
    body{background:radial-gradient(1000px 600px at 50% -10%, #ffffff 0%, transparent 60%),linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%)}
    .logo{background:linear-gradient(145deg,#fff,#eceaf0);box-shadow:0 10px 28px rgba(0,0,0,.10), inset 0 1px 0 #fff}
    a.card{box-shadow:0 6px 18px rgba(0,0,0,.06)}
    footer{color:#9a9aa6}
  }
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <main class="wrap">
    <div class="logo">P</div>
    <h1>Pienti</h1>
    <p class="sub">Aşağıdan bize ulaşabilir ve dijital kataloğumuzu inceleyebilirsiniz.</p>

    <nav class="links">
      <a class="card" href="https://linktr.ee/pienti" target="_blank" rel="noopener">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        </span>
        <span class="txt"><b>Tüm Bağlantılarımız</b><span>Sosyal medya, iletişim ve daha fazlası</span></span>
        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
      </a>

      <a class="card" href="https://publuu.com/flip-book/877949/2494342/page/16" target="_blank" rel="noopener">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M2 4.5h7a3 3 0 0 1 3 3V20a2.5 2.5 0 0 0-2.5-2.5H2z"/><path d="M22 4.5h-7a3 3 0 0 0-3 3V20a2.5 2.5 0 0 1 2.5-2.5H22z"/></svg>
        </span>
        <span class="txt"><b>Dijital Katalog</b><span>Ürün kataloğunu çevrimiçi inceleyin</span></span>
        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
      </a>
    </nav>

    <footer>© <span id="y"></span> Pienti</footer>
  </main>
  <script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
